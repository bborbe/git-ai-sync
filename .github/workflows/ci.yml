name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  # The Go port (spec 007). Landed by the operator, never by the dark-factory
  # agent: its GitHub App holds no `workflows` permission, so any agent commit
  # touching .github/workflows/ is rejected at push.
  #
  # The former Python `test` job was removed with the Python install/test path —
  # it ran `make test` / `make check` on a Python runner, and both targets now
  # resolve to Go commands.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain follows the module's own `go`
          # directive instead of a version pinned here that drifts.
          go-version-file: go.mod
          cache: true
      # precommit-go is gofmt -l + go vet + go test. Running it whole keeps the
      # formatting gate CI had under the Python `make check`; `make test-go`
      # alone would compile and test without checking formatting at all.
      - name: Run Go precommit checks
        run: make precommit-go

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          # Must match the floor .goreleaser.yaml requires (hooks.post.install_steps).
          version: 'v2.19.0'
          args: check
