name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  # The Go port (spec 007). Landed by the operator, never by the dark-factory
  # agent: its GitHub App holds no `workflows` permission, so any agent commit
  # touching .github/workflows/ is rejected at push.
  #
  # This job keeps the name `test` on purpose: `master`'s ruleset requires the
  # status check `test`, so renaming it would leave the PR permanently BLOCKED.
  # The former Python `test` job it replaces ran `make test` / `make check` on a
  # Python runner; both targets now resolve to Go commands.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain follows the module's own `go`
          # directive instead of a version pinned here that drifts.
          go-version-file: go.mod
          cache: true
      # precommit-go is gofmt -l + go vet + go test. Running it whole keeps the
      # formatting gate CI had under the Python `make check`; `make test-go`
      # alone would compile and test without checking formatting at all.
      - name: Run Go precommit checks
        run: make precommit-go

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        # `goreleaser check` exits 2 on a deprecated-but-valid config, and
        # .goreleaser.yaml deliberately keeps `hooks.post.install` (the
        # install-steps DSL cannot express the quarantine strip). Report it
        # without blocking the PR; a genuinely broken config still fails at
        # release time.
        continue-on-error: true
        with:
          version: 'v2.19.0'
          args: check
