name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not '3.x': '3.x' began resolving to 3.15, where a transitive
          # dev dependency (librt, via mypy) has no wheel and fails to compile
          # from source. The project declares requires-python >=3.14.
          python-version: '3.14'
      - name: Install uv
        run: pip install uv
      - name: Run tests
        run: make test
      - name: Run checks
        run: make check

  # The Go port (spec 007). Landed by the operator, never by the dark-factory
  # agent: its GitHub App holds no `workflows` permission, so any agent commit
  # touching .github/workflows/ is rejected at push.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain follows the module's own `go`
          # directive instead of a version pinned here that drifts.
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: make test-go
